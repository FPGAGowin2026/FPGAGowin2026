fpga_gateway_node:
  ros__parameters:
    # 硬件启动默认值；fpga_hardware.launch.py 仅覆盖 FPGA 地址与两个 UDP 端口，其余值保留 YAML 配置。
    fpga_ip: 192.168.50.2
    bind_ip: 0.0.0.0
    control_port: 5000
    telemetry_port: 5001
    control_rate_hz: 100.0
    receive_rate_hz: 500.0
    command_timeout_ms: 200
    link_timeout_ms: 300
    wheel_separation_m: 0.30
    wheel_radius_m: 0.05
    encoder_ticks_per_rev: 2048
    # 融合权重初值；实车采集静止、直行和定点旋转数据后再标定。
    wheel_position_variance_m2: 0.01
    wheel_yaw_variance_rad2: 0.02
    wheel_linear_velocity_variance: 0.02
    wheel_angular_velocity_variance: 0.04
    imu_angular_velocity_variance: 0.01
    imu_linear_acceleration_variance: 0.10
    odom_frame_id: odom
    base_frame_id: base_footprint
    imu_frame_id: imu_link
    range_front_frame_id: range_front_link
    range_left_frame_id: range_left_link
    range_right_frame_id: range_right_link

fake_fpga_node:
  ros__parameters:
    # fake 节点仅服务主机仿真；仿真 launch 会把端点改为本机回环地址和测试端口。
    listen_ip: 127.0.0.1
    jetson_ip: 127.0.0.1
    control_port: 15000
    telemetry_port: 15001
    telemetry_rate_hz: 100.0
    status_rate_hz: 10.0
    command_watchdog_ms: 250
    wheel_separation_m: 0.30
    wheel_radius_m: 0.05
    encoder_ticks_per_rev: 2048
    # 非零时按发送包计数注入丢包或 CRC 损坏，默认关闭以保持确定性闭环。
    drop_every_n: 0
    corrupt_every_n: 0
