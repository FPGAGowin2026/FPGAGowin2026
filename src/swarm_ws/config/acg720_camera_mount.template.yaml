# Copy to acg720_camera_mount.yaml and replace every null with a measured value.
# T_parent_child transforms camera optical coordinates into lidar coordinates.
# Units: metres and radians; rotation = Rz(yaw) * Ry(pitch) * Rx(roll).
# Optical axes: x right, y down, z forward. Lidar: x forward, y left, z up.
parent_frame: acg720_lidar
child_frame: acg720_camera_optical
translation:
  x: null
  y: null
  z: null
rotation_rpy:
  roll: null
  pitch: null
  yaw: null
