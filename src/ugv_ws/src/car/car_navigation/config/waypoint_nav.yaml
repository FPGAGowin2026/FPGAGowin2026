waypoint_nav:
  controller_server:
    ros__parameters:
      controller_frequency: 20.0
      odom_topic: /odom
      min_x_velocity_threshold: 0.005
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.005
      failure_tolerance: 0.5
      progress_checker_plugin: progress
      progress:
        plugin: nav2_controller::PoseProgressChecker
        required_movement_radius: 0.10
        required_movement_angle: 0.50
        movement_time_allowance: 8.0
      goal_checker_plugins: [waypoint_goal]
      waypoint_goal:
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.10
        yaw_goal_tolerance: 0.10
        stateful: true
      controller_plugins: [FollowPath]
      FollowPath:
        plugin: nav2_rotation_shim_controller::RotationShimController
        primary_controller: nav2_mppi_controller::MPPIController
        # Align each new leg before driving. Humble uses a separate threshold to finish the turn.
        angular_dist_threshold: 0.20
        angular_disengage_threshold: 0.10
        # A short path outside XY tolerance still needs an initial turn toward it.
        forward_sampling_distance: 0.10
        rotate_to_heading_angular_vel: 0.60
        max_angular_accel: 1.5
        # Ramp from the last turn command while the wheels overcome static friction.
        closed_loop: false
        simulate_ahead_time: 1.0
        rotate_to_goal_heading: true
        motion_model: DiffDrive
        vx_min: 0.0
        vx_max: 0.50
        vy_max: 0.0
        # The BX72 output commit accepts at most 800 mrad/s.
        wz_max: 0.80
        model_dt: 0.05
        time_steps: 44
        batch_size: 600
        iteration_count: 1
        prune_distance: 1.7
        transform_tolerance: 0.15
        visualize: false
        critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                  PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
        CostCritic:
          consider_footprint: true
          cost_weight: 4.0
          trajectory_point_step: 2
        # Follow the detour until the last 0.5 m, then converge on the goal.
        PathFollowCritic:
          threshold_to_consider: 0.5
        GoalCritic:
          threshold_to_consider: 0.5
        GoalAngleCritic:
          # Match the rotation shim's handover to the final heading at XY tolerance.
          threshold_to_consider: 0.10
        PathAlignCritic:
          cost_weight: 8.0

  local_costmap:
    local_costmap:
      ros__parameters:
        global_frame: odom
        robot_base_frame: base_link
        # XTARK R20-MEC local map cadence. Collision Monitor reads /scan directly.
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.05
        update_frequency: 5.0
        publish_frequency: 2.0
        transform_tolerance: 0.20
        footprint: "[[0.13, 0.125], [0.13, -0.125], [-0.13, -0.125], [-0.13, 0.125]]"
        footprint_padding: 0.02
        plugins: [obstacle_layer, inflation_layer]
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          observation_sources: scan
          scan:
            topic: /scan
            data_type: LaserScan
            marking: true
            clearing: true
            obstacle_max_range: 2.0
            raytrace_max_range: 3.0
            observation_persistence: 0.0
            expected_update_rate: 0.35
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 4.0
          # At 0.50 m/s the trial guard slows at 0.945 m from the lidar,
          # 0.13 m ahead of base_link. Round up to the next 5 cm cell.
          inflation_radius: 1.10

  collision_monitor:
    ros__parameters:
      base_frame_id: base_link
      odom_frame_id: odom
      cmd_vel_in_topic: cmd_vel_drive
      cmd_vel_out_topic: cmd_vel_safe
      transform_tolerance: 0.15
      source_timeout: 0.35
      polygons: [FootprintApproach]
      FootprintApproach:
        type: polygon
        action_type: approach
        footprint_topic: /waypoint_nav/local_costmap/published_footprint
        time_before_collision: 1.2
        simulation_time_step: 0.05
        max_points: 1
        visualize: false
      observation_sources: [scan]
      scan:
        type: scan
        topic: /scan
