/acg720/icp_odometry:
  ros__parameters:
    frame_id: acg720_lidar
    odom_frame_id: acg720_odom
    publish_tf: true
    qos: 2
    topic_queue_size: 1
    wait_for_transform: 0.2
    # No IMU fusion or deskewing without measured sensor extrinsics/timestamps.
    wait_imu_to_init: false
    deskewing: false
    Reg/Force3DoF: "true"
    Icp/PointToPlane: "false"

/acg720/slam_toolbox:
  ros__parameters:
    mode: mapping
    stack_size_to_use: 128000000
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: acg720_odom
    map_frame: acg720_map
    map_name: /acg720/map
    base_frame: acg720_lidar
    scan_topic: /acg720/scan
    scan_queue_size: 1
    scan_buffer_size: 10
    use_scan_matching: true
    do_loop_closing: true
    enable_interactive_mode: false
    resolution: 0.05
    min_laser_range: 0.02
    max_laser_range: 12.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.2
    minimum_time_interval: 0.4
    correlation_search_space_dimension: 0.5
    map_update_interval: 3.0
    transform_publish_period: 0.02
    transform_timeout: 0.2
